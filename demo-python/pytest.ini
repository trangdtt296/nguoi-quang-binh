[pytest]
testpaths = tests
# --headed      : mở trình duyệt thật lên cho người xem thấy
# --slowmo 800  : mỗi thao tác chậm 0,8 giây để kịp theo dõi
# --screenshot  : chụp màn hình khi test fail (lưu ở test-results/)
addopts = --browser chromium --headed --slowmo 800 --screenshot only-on-failure -v
